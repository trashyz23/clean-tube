<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f0f0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>CleanTube Music — Background Player</title>
  <style>
    :root {
      --bg-primary: #0f0f0f;
      --bg-secondary: #181818;
      --bg-elevated: #272727;
      --bg-hover: #383838;
      --text-primary: #f1f1f1;
      --text-secondary: #aaaaaa;
      --accent: #3ea6ff;
      --accent-hover: #65b8ff;
      --danger: #ff4e45;
      --heart: #ff4081;
      --border-radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.45;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 15, 15, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--bg-elevated);
      padding: 0.75rem 1.25rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 700;
      font-size: 1.2rem;
      color: var(--text-primary);
      text-decoration: none;
    }

    .brand-icon {
      width: 28px;
      height: 20px;
      background: var(--danger);
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .brand-icon::after {
      content: "";
      border-style: solid;
      border-width: 4px 0 4px 7px;
      border-color: transparent transparent transparent #fff;
      margin-left: 2px;
    }

    .search-form {
      flex: 1;
      max-width: 640px;
      display: flex;
      gap: 0.5rem;
    }

    .search-input {
      flex: 1;
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 1px solid var(--bg-elevated);
      border-radius: 24px;
      padding: 0.6rem 1.1rem;
      font-size: 0.95rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .btn {
      background: var(--bg-elevated);
      color: var(--text-primary);
      border: none;
      border-radius: 24px;
      padding: 0.55rem 1rem;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .btn:hover:not(:disabled) {
      background: var(--bg-hover);
    }

    .btn-primary {
      background: var(--accent);
      color: #080808;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .btn-sm {
      padding: 0.4rem 0.8rem;
      font-size: 0.8rem;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .container {
      width: 100%;
      max-width: 1320px;
      margin: 0 auto;
      padding: 1.25rem;
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    @media (min-width: 960px) {
      .container {
        grid-template-columns: 1.45fr 1fr;
        align-items: start;
      }
    }

    .player-section {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .video-stage {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: var(--border-radius);
      overflow: hidden;
      position: relative;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      position: absolute;
      inset: 0;
      z-index: 1;
      background: #000;
    }

    .artwork-stage {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: radial-gradient(circle at center, #222 0%, #0a0a0a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      gap: 0.75rem;
      text-align: center;
    }

    .artwork-stage.hidden {
      display: none;
    }

    .artwork-stage img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 14px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.75);
    }

    .audio-bar-wrapper {
      position: relative;
      z-index: 5;
      margin-top: auto;
      background: rgba(15, 15, 15, 0.88);
      backdrop-filter: blur(8px);
      padding: 0.5rem 0.75rem;
      border-top: 1px solid var(--bg-elevated);
    }

    /* Master Audio Element: Drives all sound so Android Chrome never pauses when screen locks */
    #bgAudioPlayer {
      width: 100%;
      height: 40px;
      display: block;
    }

    .meta-card {
      background: var(--bg-secondary);
      border-radius: var(--border-radius);
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .video-title {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.35;
    }

    .fav-btn {
      background: var(--bg-elevated);
      border: none;
      color: var(--text-secondary);
      border-radius: 50%;
      width: 38px;
      height: 38px;
      font-size: 1.15rem;
      cursor: pointer;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .fav-btn.active {
      color: var(--heart);
    }

    .video-sub {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.85rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--bg-elevated);
    }

    .toggles-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
    }

    .toggle-label {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      cursor: pointer;
      font-size: 0.86rem;
      user-select: none;
    }

    .toggle-label input {
      accent-color: var(--accent);
      width: 16px;
      height: 16px;
    }

    .status-pill {
      font-size: 0.8rem;
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      background: var(--bg-elevated);
      color: var(--accent);
      font-weight: 500;
    }

    .results-section {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .tabs-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      border-bottom: 1px solid var(--bg-elevated);
      padding-bottom: 0.65rem;
    }

    .tab-btn {
      background: var(--bg-secondary);
      color: var(--text-secondary);
      border: 1px solid transparent;
      border-radius: 20px;
      padding: 0.42rem 0.85rem;
      font-size: 0.83rem;
      font-weight: 600;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--text-primary);
      color: var(--bg-primary);
    }

    .queue-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0 0.2rem;
    }

    .queue-subtitle {
      font-size: 0.84rem;
      color: var(--text-secondary);
    }

    .results-list {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      max-height: 72vh;
      overflow-y: auto;
      padding-right: 4px;
    }

    .result-item {
      display: grid;
      grid-template-columns: 130px 1fr auto;
      align-items: center;
      gap: 0.75rem;
      background: var(--bg-secondary);
      border-radius: 10px;
      padding: 0.5rem;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .result-item:hover {
      background: var(--bg-elevated);
    }

    .result-item.playing {
      border-color: var(--accent);
      background: rgba(62, 166, 255, 0.1);
    }

    .thumb-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }

    .thumb-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .duration-badge {
      position: absolute;
      bottom: 4px;
      right: 4px;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 5px;
      border-radius: 4px;
    }

    .play-count-badge {
      position: absolute;
      top: 4px;
      left: 4px;
      background: rgba(62, 166, 255, 0.92);
      color: #000;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .result-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.25rem;
      overflow: hidden;
    }

    .result-title {
      font-size: 0.89rem;
      font-weight: 600;
      color: var(--text-primary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .result-meta {
      font-size: 0.78rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .remove-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 1.1rem;
      padding: 0.4rem;
      border-radius: 50%;
      cursor: pointer;
    }

    .empty-state {
      background: var(--bg-secondary);
      border-radius: var(--border-radius);
      padding: 2rem 1.25rem;
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="/" class="brand">
      <span class="brand-icon"></span>
      <span>CleanTube Music</span>
    </a>

    <form class="search-form" id="searchForm">
      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="Search songs, artists, or paste a YouTube link..."
        autocomplete="off"
      />
      <button type="submit" class="btn btn-primary" id="searchBtn">Search / Play</button>
    </form>
  </nav>

  <main class="container">
    <!-- Left Column: Master Audio + Synced Video Player -->
    <section class="player-section">
      <div class="video-stage">
        <!-- Muted video element synced to master audio when video is available -->
        <video id="videoPlayer" muted playsinline preload="metadata"></video>

        <!-- Album Art Stage (Shown during Background-Ready Audio Mode) -->
        <div class="artwork-stage" id="artworkStage">
          <img id="overlayThumb" src="https://i.ytimg.com/vi/dQw4w9WgXcQ/hqdefault.jpg" alt="Album Art" />
          <div style="font-weight: 600; color: var(--accent); font-size: 0.9rem;">
            🔒 Lock-Screen & Background Audio Ready
          </div>
        </div>

        <!-- Master Audio Player: Always drives sound so Android Chrome never pauses on screen lock -->
        <div class="audio-bar-wrapper">
          <audio id="bgAudioPlayer" controls preload="auto"></audio>
        </div>
      </div>

      <div class="meta-card">
        <div class="title-row">
          <h1 class="video-title" id="currentTitle">Select a Song to Start Listening</h1>
          <button class="fav-btn" id="favBtn" title="Save to Favorites">♥</button>
        </div>

        <div class="video-sub">
          <span id="currentUploader">Works with screen off & minimized browser on Android</span>
          <span id="streamSourceBadge"></span>
        </div>

        <div class="controls-bar">
          <div class="toggles-group">
            <label class="toggle-label">
              <input type="checkbox" id="autoplaySimilarToggle" checked />
              <span>✨ Autoplay Similar</span>
            </label>
            <label class="toggle-label">
              <input type="checkbox" id="repeatToggle" />
              <span>🔁 Repeat Song</span>
            </label>
            <button class="btn btn-sm" id="skipNextBtn">⏭ Next Similar</button>
          </div>
          <span class="status-pill" id="playbackStatus">Idle</span>
        </div>
      </div>
    </section>

    <!-- Right Column: Most Played, Similar, Favorites & Search -->
    <aside class="results-section">
      <div class="tabs-bar">
        <button class="tab-btn active" data-tab="mostPlayed">🔥 Most Played</button>
        <button class="tab-btn" data-tab="similar">✨ Up Next / Similar</button>
        <button class="tab-btn" data-tab="favorites">❤️ Favorites</button>
        <button class="tab-btn" data-tab="search">🔍 Search</button>
      </div>

      <div class="queue-actions">
        <span class="queue-subtitle" id="queueSubtitle">Ranked by how often you listen</span>
        <div style="display: flex; gap: 0.4rem;">
          <button class="btn btn-sm" id="playAllBtn">▶ Play All</button>
          <button class="btn btn-sm" id="shuffleBtn">🔀 Shuffle</button>
        </div>
      </div>

      <div class="results-list" id="resultsList"></div>
    </aside>
  </main>

  <script src="/app.js"></script>
</body>
</html>
